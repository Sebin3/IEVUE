<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#141313" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Laney</title>

    <!-- Material Web Components <md-icon>, <md-ripple>, <md-menu>... -->
    <script src="/bundle.js"></script>

    <style id="app-theme">
    </style>

    <script>
      (function () {
        var saved = localStorage.getItem('currentTheme') || 'gray'
        var allowed = [
          'gray',
          'black',
          'green',
          'blue',
          'brown',
          'purple',
          'red',
          'pink',
          'pastel-pink',
          'super-blue',
        ]
        if (allowed.indexOf(saved) === -1) return
        fetch('/themes/' + saved + '.css')
          .then(function (res) {
            return res.text()
          })
          .then(function (css) {
            var el = document.getElementById('app-theme')
            el.textContent = css
            document.head.appendChild(el)
          })
          .catch(function (err) {
            console.error('Error loading theme:', err)
          })
      })()
    </script>
  </head>
  <body>
    <div id="app" class="app-main"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
